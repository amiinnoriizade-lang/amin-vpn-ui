name: Build and publish VPN-UI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vpn-ui-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux-amd64:
    name: Build Linux amd64 release
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make pkg-config git curl wget file xz-utils

      - name: Build complete amd64 binary
        run: |
          chmod +x ./build.sh
          ./build.sh --arch amd64
          test -s build/out/vpn-ui-amd64
          file build/out/vpn-ui-amd64
          install -m 0755 build/out/vpn-ui-amd64 ./vpn-ui-amd64

      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VPN-UI build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: vpn-ui-amd64
          make_latest: true
          generate_release_notes: true

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: vpn-ui-amd64
          make_latest: true
          generate_release_notes: true
