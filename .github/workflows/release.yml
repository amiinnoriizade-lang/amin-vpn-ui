name: Build and publish AMIN-UI

on:
  push:
    branches:
      - main
      - feat/sanaei-live-speed-nodes
      - feat/sanaei-node-user-management
      - feat/amin-native-node-api
      - feat/amin-agent-client-update
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vpn-ui-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux-amd64:
    name: Build Linux amd64 release
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make pkg-config git curl wget file xz-utils

      - name: Prepare telemt source (not tracked as a gitlink in this repository)
        run: |
          if [ ! -f third_party/telemt/Cargo.toml ]; then
            mkdir -p third_party
            git clone --depth 1 --branch main https://github.com/Sir-MmD/telemt third_party/telemt
          fi
          test -s third_party/telemt/Cargo.toml

      - name: Build complete amd64 binary
        run: |
          chmod +x ./build.sh
          ./build.sh --arch amd64
          test -s build/out/vpn-ui-amd64
          file build/out/vpn-ui-amd64
          install -m 0755 build/out/vpn-ui-amd64 ./vpn-ui-amd64

      - name: Build AMIN Node Agent for amd64 and arm64
        run: |
          cd node-agent
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "../amin-node-agent-linux-$arch" ./cmd/amin-node-agent
            test -s "../amin-node-agent-linux-$arch"
            file "../amin-node-agent-linux-$arch"
          done

      - name: Upload experimental amd64 binary
        if: startsWith(github.ref, 'refs/heads/feat/sanaei-') || github.ref == 'refs/heads/feat/amin-native-node-api' || github.ref == 'refs/heads/feat/amin-agent-client-update'
        uses: actions/upload-artifact@v4
        with:
          name: amin-ui-linux-amd64-${{ github.sha }}
          path: |
            vpn-ui-amd64
            amin-node-agent-linux-amd64
            amin-node-agent-linux-arm64
          if-no-files-found: error
          retention-days: 14

      - name: Read panel version
        id: panel-version
        if: github.ref == 'refs/heads/main'
        run: echo "version=$(cat config/version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.panel-version.outputs.version }}
          name: AMIN-UI v${{ steps.panel-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            vpn-ui-amd64
            amin-node-agent-linux-amd64
            amin-node-agent-linux-arm64
          make_latest: true
          generate_release_notes: true

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: vpn-ui-amd64
          make_latest: true
          generate_release_notes: true
